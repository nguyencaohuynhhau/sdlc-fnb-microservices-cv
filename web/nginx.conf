# SignalR: nâng cấp WebSocket khi client xin, request thường (negotiate) giữ Connection bình thường.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  root /usr/share/nginx/html;

  location /api/ {
    proxy_pass http://gateway:8080;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location = /healthz {
    proxy_pass http://gateway:8080;
  }

  location /hubs/ {
    proxy_pass http://gateway:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 1h;
    # URL chứa ?access_token=… — không ghi access log để token không lọt vào log.
    access_log off;
  }

  # Asset có hash trong tên → cache lâu; index.html thì không.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SPA fallback cho route phía client (/login, /pos, /kitchen).
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
